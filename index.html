<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felipe de Almeida - Product & Strategy Portfolio</title>
<meta name="description" content="Career case studies and self-initiated product and strategy work by Felipe de Almeida.">
<meta property="og:title" content="Felipe de Almeida - Product & Strategy Portfolio">
<meta property="og:description" content="Five career case studies and four self-initiated projects in product, strategy and applied AI.">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://felipelima2602.github.io/portfolio/">
<meta property="og:site_name" content="Felipe de Almeida">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary">
<!-- Fallback estatico para crawlers que nao rodam JS. Em runtime o script
     reescreve title, description e og:* a partir de data/cases.js. -->
<link rel="canonical" href="https://felipelima2602.github.io/portfolio/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f2a44'/%3E%3Ctext x='32' y='45' font-family='-apple-system,Segoe UI,Roboto,sans-serif' font-size='40' font-weight='700' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a class="brand" href="#/">Felipe de Almeida</a>
    <button id="lang" class="langbtn" type="button">EN / PT</button>
  </div>
</div>

<main id="app"></main>

<script type="module">
import { profile, cases } from './data/cases.js';
import { projects, projectsNote } from './data/projects.js';

const state = { lang: localStorage.getItem('lang') || 'en' };
const t = (v) => (v && typeof v === 'object' && 'en' in v) ? (v[state.lang] ?? v.en) : v;
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const copy = {
  careerTitle: { en: 'Career case studies', pt: 'Cases de carreira' },
  careerSub: { en: 'Five roles where I owned the decision, not just the delivery.', pt: 'Cinco passagens em que eu fui dono da decisao, nao apenas da entrega.' },
  projectsTitle: { en: 'Self-initiated projects', pt: 'Projetos autorais' },
  projectsSub: { en: 'Independent work in applied AI, 0 to 1 product and fintech strategy.', pt: 'Trabalhos independentes em AI aplicada, produto 0 a 1 e estrategia fintech.' },
  back: { en: 'Back to the portfolio', pt: 'Voltar para o portfolio' },
  context: { en: 'Context', pt: 'Contexto' },
  challenge: { en: 'Challenge', pt: 'Desafio' },
  actions: { en: 'What I did', pt: 'O que eu fiz' },
  outcome: { en: 'Outcome', pt: 'Resultado' },
  learning: { en: 'What I would do differently', pt: 'O que eu faria diferente' },
  cv: { en: 'Download CV', pt: 'Baixar CV' },
  read: { en: 'Read the case', pt: 'Ler o case' },
  pdf: { en: 'View PDF', pt: 'Ver PDF' },
  proto: { en: 'Figma prototype', pt: 'Prototipo no Figma' },
  langSwitch: { en: 'Mudar para portugues', pt: 'Switch to English' }
};

const chips = (arr) => `<div class="chips">${arr.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>`;

// Metrica ainda sem numero confirmado fica fora do ar ate o valor existir.
// O dado continua em cases.js e o scripts/check.mjs continua listando o pendente.
const liveMetrics = (c) => (c.metrics || []).filter(m => !String(m.value).startsWith('TODO'));

function hero() {
  return `<header class="hero"><div class="wrap">
    <h1>${esc(profile.name)}</h1>
    <div class="role">${esc(t(profile.headline))}</div>
    <p>${esc(t(profile.pitch))}</p>
    <div class="actions">
      <a class="primary" href="${profile.linkedin}" target="_blank" rel="noopener">LinkedIn &rarr;</a>
      <a class="ghost" href="mailto:${profile.email}">${esc(profile.email)}</a>
      <a class="ghost" href="${t(profile.cv)}" download>${esc(t(copy.cv))}</a>
    </div>
  </div></header>`;
}

function caseCard(c) {
  const kpis = liveMetrics(c).slice(0, 2);
  const kpiRow = kpis.length
    ? `<div class="kpis">${kpis.map(m => `<div class="kpi">
        <div class="v">${esc(m.value)}</div><div class="l">${esc(t(m.label))}</div></div>`).join('')}</div>`
    : '';
  return `<a class="card" href="#/case/${c.id}">
    <div class="accent"></div>
    <div class="body">
      <div class="eyebrow">${esc(c.company)}</div>
      <div class="meta">${esc(t(c.role))} &middot; ${esc(c.period)} &middot; ${esc(t(c.location))}</div>
      <h3>${esc(t(c.headline))}</h3>
      <p>${esc(t(c.hero))}</p>
      ${kpiRow}
      ${chips(c.tags)}
      <div class="go">${esc(t(copy.read))} &rarr;</div>
    </div></a>`;
}

function projectCard(p) {
  const pdf = p.pdf[state.lang] || p.pdf.en;
  return `<div class="card">
    <div class="cover"><img loading="lazy" src="${p.cover}" alt="${esc(p.title)}"></div>
    <div class="body">
      <div class="eyebrow">${esc(t(p.kicker))}</div>
      <h3>${esc(p.title)}</h3>
      <p>${esc(t(p.summary))}</p>
      ${chips(t(p.tags))}
      <div>
        <a class="go" href="${pdf}" target="_blank" rel="noopener">${esc(t(copy.pdf))} &rarr;</a>
        ${p.figma ? `<a class="go" href="${p.figma}" target="_blank" rel="noopener">&#9654; ${esc(t(copy.proto))}</a>` : ''}
      </div>
    </div></div>`;
}

function home() {
  const sorted = [...cases].sort((a, b) => a.order - b.order);
  return `${hero()}<div class="wrap">
    <h2 class="section-title">${esc(t(copy.careerTitle))}</h2>
    <p class="section-sub">${esc(t(copy.careerSub))}</p>
    <div class="grid">${sorted.map(caseCard).join('')}</div>

    <h2 class="section-title">${esc(t(copy.projectsTitle))}</h2>
    <p class="section-sub">${esc(t(copy.projectsSub))}</p>
    <div class="grid">${[...projects].sort((a, b) => a.order - b.order).map(projectCard).join('')}</div>
    <p class="note">${esc(t(projectsNote))}</p>

    <footer class="site">${esc(profile.name)} &middot; ${esc(t(profile.location))} &middot; ${esc(t(profile.languages))}</footer>
  </div>`;
}

function casePage(c) {
  const list = (arr) => `<ul>${arr.map(i => `<li>${esc(t(i))}</li>`).join('')}</ul>`;
  const block = (title, body) => `<h2>${esc(t(title))}</h2>${body}`;
  const metric = (m) => `<div class="metric"><div class="v">${esc(m.value)}</div>
      <div class="l">${esc(t(m.label))}</div></div>`;
  const shown = liveMetrics(c);
  return `<div class="wrap reading case">
    <a class="backlink" href="#/">&larr; ${esc(t(copy.back))}</a>
    <div class="eyebrow">${esc(c.company)}</div>
    <h1>${esc(t(c.headline))}</h1>
    <div class="meta">${esc(t(c.role))} &middot; ${esc(c.period)} &middot; ${esc(t(c.location))}</div>
    <p class="lead">${esc(t(c.hero))}</p>
    ${chips(c.tags)}
    ${shown.length ? `<div class="metrics">${shown.map(metric).join('')}</div>` : ''}
    ${block(copy.context, `<p>${esc(t(c.context))}</p>`)}
    ${block(copy.challenge, `<p>${esc(t(c.challenge))}</p>`)}
    ${block(copy.actions, list(c.actions))}
    ${block(copy.outcome, list(c.outcome))}
    ${block(copy.learning, `<p>${esc(t(c.learning))}</p>`)}
    <footer class="site"><a href="${profile.linkedin}" target="_blank" rel="noopener">LinkedIn</a> &middot;
      <a href="mailto:${profile.email}">${esc(profile.email)}</a></footer>
  </div>`;
}

// SEO e Open Graph saem do perfil e do case, nunca de texto fixo no HTML.
const SITE = 'https://felipelima2602.github.io/portfolio/';
function meta(name, value) {
  const sel = /^(og|twitter):/.test(name) ? `meta[property="${name}"], meta[name="${name}"]` : `meta[name="${name}"]`;
  let el = document.head.querySelector(sel);
  if (!el) {
    el = document.createElement('meta');
    el.setAttribute(/^og:/.test(name) ? 'property' : 'name', name);
    document.head.appendChild(el);
  }
  el.setAttribute('content', value);
}
function seo(c) {
  const title = c ? `${c.company} - ${t(c.headline)}` : `${profile.name} - ${t(profile.headline)}`;
  const desc = c ? t(c.hero) : t(profile.pitch);
  const url = c ? `${SITE}#/case/${c.id}` : SITE;
  document.title = title;
  meta('description', desc);
  meta('og:title', title);
  meta('og:description', desc);
  meta('og:url', url);
  meta('og:type', c ? 'article' : 'profile');
  meta('og:locale', state.lang === 'pt' ? 'pt_BR' : 'en_US');
  meta('twitter:card', 'summary');
  meta('twitter:title', title);
  meta('twitter:description', desc);
  let link = document.head.querySelector('link[rel="canonical"]');
  if (!link) { link = document.createElement('link'); link.rel = 'canonical'; document.head.appendChild(link); }
  link.href = url;
}

let lastRoute = null;
function render() {
  const m = location.hash.match(/^#\/case\/(.+)$/);
  const c = (m && cases.find(x => x.id === m[1])) || null;
  if (m && !c) { location.replace('#/'); return; } // slug inexistente volta para a home
  document.getElementById('app').innerHTML = c ? casePage(c) : home();
  document.documentElement.lang = state.lang;
  seo(c);
  const btn = document.getElementById('lang');
  btn.setAttribute('aria-label', t(copy.langSwitch));
  btn.title = t(copy.langSwitch);
  const route = c ? c.id : 'home';
  if (route !== lastRoute) window.scrollTo(0, 0); // trocar idioma nao joga o leitor para o topo
  lastRoute = route;
}

document.getElementById('lang').addEventListener('click', () => {
  state.lang = state.lang === 'en' ? 'pt' : 'en';
  localStorage.setItem('lang', state.lang);
  render();
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
